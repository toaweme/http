name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release

jobs:
  # gate the release on care: a tag only ships a release if care's checks pass
  # on the tagged commit.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - uses: toaweme/care@7c1be005491b89ec9a83013616abfd71fda71899 # v0.9.6
        with:
          strict: true

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # care needs full history to derive changelog notes

      - uses: toaweme/care@7c1be005491b89ec9a83013616abfd71fda71899 # v0.9.6
        with:
          install-only: true

      # care generates the conventional-commit notes (the org's single source
      # for a release body). Written to the runner temp dir, not the work tree,
      # so the checkout stays clean. tee echoes the notes into the job log, and
      # the non-empty guard substitutes a fallback rather than shipping an empty
      # release body.
      - name: Generate release notes
        run: |
          notes="$RUNNER_TEMP/notes.md"
          care changelog --plain | tee "$notes" || true
          if [ ! -s "$notes" ]; then
            echo "::warning::care changelog produced empty notes; using fallback"
            echo "See the commit history for changes in this release." > "$notes"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
