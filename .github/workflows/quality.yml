name: Quality

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the client module at the repo root.
  client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # publish the report to the care dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - uses: toaweme/care@7c1be005491b89ec9a83013616abfd71fda71899 # v0.9.6
        with:
          strict: true
          publish-url: https://code.toawe.me/ingest?kind=care

      # publish the client module's code view to code.toawe.me
      - uses: toaweme/codereport@4339d9a8925f49e96235dea80a87a5c2bf4d3746 # v0.4.0
        with:
          publish-url: https://code.toawe.me/ingest?kind=code

  # the server module, which has its own go.mod under server/.
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - uses: toaweme/care@7c1be005491b89ec9a83013616abfd71fda71899 # v0.9.6
        with:
          dir: server
          strict: true
          publish-url: https://code.toawe.me/ingest?kind=care

      # publish the server module's code view to code.toawe.me
      - uses: toaweme/codereport@4339d9a8925f49e96235dea80a87a5c2bf4d3746 # v0.4.0
        with:
          dir: server
          publish-url: https://code.toawe.me/ingest?kind=code
